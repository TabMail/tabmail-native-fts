# cargo-about configuration for THIRD_PARTY_NOTICES.txt (generate with scripts/generate-third-party-notices.sh).
# Licenses in order of preference: for a crate offered under a choice of licenses, the first accepted one
# is the one whose text is reproduced.
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "BSL-1.0", "Unicode-3.0", "CDLA-Permissive-2.0", "MPL-2.0",
    "Unlicense", "0BSD", "BSD-1-Clause", "LGPL-2.1", "blessing",
]
# Every target the helper is released for: Thunderbird (macOS universal, Windows x64, Linux x64) and
# TabMail Voice's voice-memory (macOS, Windows and Linux, x64 and arm64).
targets = [
    "aarch64-apple-darwin", "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Clarifications: crates that ship no license file, or one the scanner cannot read, so that the notice
# reproduces the real file (with its copyright line) instead of a generic license template. Each file is
# pinned by its SHA-256; a changed file makes the generator fail rather than fall back.

# ring: ISC for its own code, Apache-2.0 for code from BoringSSL, MIT for code from once_cell.
[ring.clarify]
license = "Apache-2.0 AND ISC AND MIT"
[[ring.clarify.files]]
path = "LICENSE-other-bits"
license = "ISC"
checksum = "f025ccfb7dfb6bdfedc75ca0f67acc69e6fb4998143d834f7c2f38a29989680f"
[[ring.clarify.files]]
path = "LICENSE-BoringSSL"
license = "Apache-2.0"
checksum = "005fc765ddc5115da796cca915baa9557abae13ff35e0a47c47affc56f6c414d"
[[ring.clarify.files]]
path = "src/polyfill/once_cell/LICENSE-MIT"
license = "MIT"
checksum = "6ee2ed6c77710de911761acd5fc1ad1da00f476beb1a7ef27e78c2d1858deafc"

# onig_sys compiles the bundled Oniguruma C library (BSD-2-Clause) next to its own MIT bindings.
